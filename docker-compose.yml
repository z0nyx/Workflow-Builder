services:
  postgres:
    image: postgres:17-alpine
    container_name: workflow-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow_builder
      POSTGRES_USER: workflow_builder
      POSTGRES_PASSWORD: workflow_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U workflow_builder -d workflow_builder"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: workflow-builder-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
